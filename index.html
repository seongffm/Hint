<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>취준 루틴</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
/* Achromatic ledger: chrome in ink, one hue (--data) on the main data element only.
   Canvas: one centred 720px column, 16px phone margins, one 12px gap. KPI row: 3 equal cells = 100% of the card. */
:root{
  --ground:#f2f4f7; --surface:#fff; --raised:#e9ecf0; --border:#e3e6ea; --rule:#eef0f2; --control:#cfd4da;
  --text:#0a0a0a; --muted:#666c73; --accent:#141414; --data:#1d5fbf; --track:#e6e9ee;
  --ok-bg:#dcfae5; --ok-ink:#04250e; --bad-bg:#ffedea; --bad-ink:#831c1e; --neu-bg:#eceef1; --neu-ink:#3d4147;
  --r-card:8px; --r-ctl:6px; --gap:12px; --pad:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ground);color:var(--text);font:400 14px/1.5 "Geist","Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;font-variant-numeric:tabular-nums;max-width:720px;margin:0 auto;padding:24px 16px 48px}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}

/* 헤더 */
.brand{display:flex;align-items:center;gap:8px;font-weight:500;margin-bottom:24px}
.brand svg{display:block}
header h1{font-size:24px;font-weight:500;line-height:1.25;letter-spacing:-.01em}
#finding{color:var(--muted);margin-top:4px;min-height:21px}

/* 탭: 활성 항목은 회색 알약 */
.nav-tabs{display:flex;gap:4px;margin:20px 0 var(--gap)}
.tab-btn{border:0;background:transparent;color:var(--muted);font:500 14px/1 inherit;font-family:inherit;padding:10px 14px;border-radius:var(--r-ctl);cursor:pointer}
.tab-btn:hover{background:var(--rule);color:var(--text)}
.tab-btn.active{background:var(--raised);color:var(--text)}
.tab-content{display:none}.tab-content.active{display:block}

.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-card);padding:var(--pad);margin-bottom:var(--gap)}
.card h2{font-size:16px;font-weight:500}

/* 입력 */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;color:var(--muted);margin-bottom:6px}
input,select{width:100%;height:36px;padding:0 10px;border:1px solid var(--control);border-radius:var(--r-ctl);background:var(--surface);color:var(--text);font:inherit}
input::placeholder{color:#8a9097}
.form-row{display:flex;gap:var(--gap)}.form-row .form-group{flex:1;min-width:0}
.btn-submit{width:100%;height:40px;background:var(--accent);color:#fff;border:0;border-radius:var(--r-ctl);font:500 14px inherit;font-family:inherit;cursor:pointer}
.btn-submit:hover{background:#2b2b2b}
.btn-submit:disabled{background:var(--control);color:#fff;cursor:default}

/* 요약: 하나의 카드를 헤어라인으로 나눈 지표 */
.kpis{display:grid;grid-template-columns:repeat(3,1fr);padding:0}
.kpi{padding:var(--pad);border-left:1px solid var(--rule)}
.kpi:first-child{border-left:0}
.kpi .title{font-size:12px;color:var(--muted)}
.kpi .value{font-size:28px;font-weight:500;line-height:1.2;margin-top:4px;letter-spacing:-.01em}
.kpi .value small{font-size:14px;color:var(--muted);font-weight:400;margin-left:2px}
.battery-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.battery-bar-bg{height:10px;background:var(--track);border-radius:3px;overflow:hidden}
.battery-bar-fill{height:100%;width:0;background:var(--data);border-radius:3px;transition:width .3s}
.scale{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:6px}

/* 목록: 구분선과 정렬로만 */
.filter-group{margin-bottom:var(--gap);max-width:220px}
.rows{padding:0 var(--pad)}
.record-item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 0;border-top:1px solid var(--rule);align-items:center}
.record-item:first-child{border-top:0}
.record-title{font-weight:500}
.record-fig{text-align:right;font-weight:500}
.record-fig span{color:var(--muted);font-weight:400}
.record-sub{font-size:12px;color:var(--muted)}
.badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;line-height:18px;background:var(--neu-bg);color:var(--neu-ink);margin-left:8px;vertical-align:1px}
.badge-승인{background:var(--ok-bg);color:var(--ok-ink)}
.badge-미달{background:var(--bad-bg);color:var(--bad-ink)}
.empty{padding:32px var(--pad);text-align:center;color:var(--muted)}

/* 상태 */
#loading{display:none;color:var(--muted);padding:8px 0}
#error{display:none;background:var(--bad-bg);color:var(--bad-ink);border-radius:var(--r-ctl);padding:10px 12px;margin-bottom:var(--gap)}
#error button{margin-left:8px;border:0;background:none;color:inherit;text-decoration:underline;font:inherit;cursor:pointer}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 16px;border-radius:var(--r-ctl);display:none;box-shadow:0 4px 12px rgba(0,0,0,.18)}

@media (max-width:480px){body{padding-top:16px}.kpi{padding:12px}.kpi .value{font-size:22px}.form-row{flex-direction:column;gap:0}}
@media (prefers-reduced-motion:reduce){.battery-bar-fill{transition:none}}
</style>
</head>
<body>
<div class="brand">
  <svg width="24" height="14" viewBox="0 0 24 14" aria-hidden="true"><rect x=".5" y=".5" width="20" height="13" rx="3" fill="none" stroke="#141414"/><rect x="3" y="3" width="9" height="8" rx="1" fill="#1d5fbf"/><rect x="22" y="4.5" width="2" height="5" rx="1" fill="#141414"/></svg>
  <span>취준 루틴</span>
</div>

<header>
  <h1>오늘의 루틴</h1>
  <p id="finding">기록을 불러오는 중입니다.</p>
</header>

<div class="nav-tabs" role="tablist">
  <button class="tab-btn active" onclick="switchTab('input', this)">입력</button>
  <button class="tab-btn" onclick="switchTab('summary', this)">요약</button>
  <button class="tab-btn" onclick="switchTab('list', this)">목록</button>
</div>

<div id="error" role="alert"><span id="errorMsg"></span><button type="button" onclick="loadDashboardData()">다시 시도</button></div>
<div id="gate" class="card" style="display:none">
  <div class="form-group"><label for="gateInput">접근 코드</label><input type="password" id="gateInput" autocomplete="current-password"></div>
  <p id="gateMsg" class="record-sub" style="margin-bottom:12px">처음 한 번만 입력하면 이 기기에 저장됩니다.</p>
  <button type="button" class="btn-submit" onclick="saveGate()">확인</button>
</div>
<div id="loading">처리 중…</div>

<!-- 1. 입력 -->
<div id="tab-input" class="tab-content active">
  <div class="card">
    <form id="recordForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group"><label for="date">날짜</label><input type="date" id="date" required></div>
      <div class="form-group"><label for="category">항목</label>
        <select id="category" required>
          <option value="공부">공부</option><option value="자소서">자소서</option>
          <option value="포트폴리오">포트폴리오</option><option value="운동">운동</option>
        </select></div>
      <div class="form-row">
        <div class="form-group"><label for="goalValue">목표 (시간·건수)</label><input type="number" id="goalValue" min="1" step="0.5" inputmode="decimal" required></div>
        <div class="form-group"><label for="achieveValue">달성 (시간·건수)</label><input type="number" id="achieveValue" min="0" step="0.5" inputmode="decimal" required></div>
      </div>
      <div class="form-group"><label for="memo">메모 (선택)</label><input type="text" id="memo" placeholder="예: 독서실 집중 성공"></div>
      <div class="form-group"><label for="retrospect">한 줄 회고 · 감정</label><input type="text" id="retrospect" placeholder="예: 오늘 집중 잘 됨, 덤덤함"></div>
      <button type="submit" class="btn-submit" id="saveBtn">기록 저장</button>
    </form>
  </div>
</div>

<!-- 2. 요약 -->
<div id="tab-summary" class="tab-content">
  <div class="card kpis">
    <div class="kpi"><div class="title">이번 주 집중시간</div><div class="value"><span id="totalHours">–</span><small>시간</small></div></div>
    <div class="kpi"><div class="title">주간 휴식 승인</div><div class="value"><span id="restApprovedCount">–</span><small>회</small></div></div>
    <div class="kpi"><div class="title">전체 달성률</div><div class="value"><span id="achievementRate">–</span><small>%</small></div></div>
  </div>
  <div class="card">
    <div class="battery-head"><h2>오늘치 휴식 배터리</h2><span id="batteryText">–</span></div>
    <div class="battery-bar-bg"><div class="battery-bar-fill" id="batteryFill"></div></div>
    <div class="scale"><span>0%</span><span>휴식 승인 100%</span></div>
  </div>
</div>

<!-- 3. 목록 -->
<div id="tab-list" class="tab-content">
  <div class="filter-group">
    <select id="filterCategory" onchange="renderList()" aria-label="항목 필터">
      <option value="전체">전체 항목</option><option value="공부">공부</option><option value="자소서">자소서</option>
      <option value="포트폴리오">포트폴리오</option><option value="운동">운동</option>
    </select>
  </div>
  <div class="card rows" id="recordList"></div>
</div>

<div id="toast" role="status"></div>

<script>
// Vercel Functions API (Google Apps Script 의존성 제거)
const API_URL = '/api';
let globalRecords = [];
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// 로컬(한국) 날짜 기준. toISOString은 UTC라 오전 9시 전에 전날로 찍힙니다.
function todayLocal(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}

document.addEventListener('DOMContentLoaded', () => { $('date').value = todayLocal(); loadDashboardData(); });

function switchTab(tabName, btn){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const t = $('tab-' + tabName); if (t) t.classList.add('active');
  if (tabName === 'summary' || tabName === 'list') loadDashboardData();
}

// 접근 코드는 이 기기의 localStorage에만 저장한다 (코드에 넣지 않는다)
function getToken(){try{return localStorage.getItem('rt')||'';}catch(e){return '';}}
function showGate(msg){$('gate').style.display='block';if(msg)$('gateMsg').innerText=msg;}
function saveGate(){
  const v=$('gateInput').value.trim(); if(!v) return;
  try{localStorage.setItem('rt',v);}catch(e){}
  $('gate').style.display='none'; $('gateInput').value=''; loadDashboardData();
}
function api(action, payload){
  return fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+getToken()},
    body:JSON.stringify(Object.assign({action:action},payload||{}))})
    .then(async r=>{
      const raw=await r.text(); let j;
      try{j=JSON.parse(raw);}catch(e){throw new Error('서버 응답 오류 ('+r.status+'). 잠시 후 다시 시도해 주세요.');}
      if(!r.ok || !j.ok) throw new Error(j.error||('요청 실패 ('+r.status+')'));
      return j.data;
    });
}

function loadDashboardData(){
  $('error').style.display='none';
  if(!getToken()){showGate();return;}
  showLoading(true);
  api('data').then(onDataLoaded).catch(onDataError);
}

// 한 줄 요약은 이 함수 하나에서만 만든다 (같은 사실을 두 곳에 따로 쓰지 않기 위해)
function findingText(rate){
  if (rate >= 100) return '오늘 목표를 모두 채웠습니다. 휴식이 승인됩니다.';
  if (rate > 0) return '휴식 승인까지 ' + (100 - rate) + '%p 남았습니다.';
  return '아직 기록이 없습니다. 첫 루틴을 입력하면 배터리가 채워집니다.';
}

function onDataLoaded(data){
  showLoading(false);
  globalRecords = data.records || [];
  const rate = Math.max(0, Math.round(Number(data.achievementRate) || 0));
  const today = Math.max(0, Math.round(Number(data.todayRate) || 0));
  const fill = Math.min(today, 100);
  $('totalHours').innerText = data.totalHours;
  $('restApprovedCount').innerText = data.restApprovedCount;
  $('achievementRate').innerText = rate;
  $('batteryFill').style.width = fill + '%';
  $('batteryText').innerText = fill + '%';
  $('finding').innerText = findingText(rate);
  renderList();
}

function onDataError(error){
  showLoading(false);
  if(error && error.message==='unauthorized'){try{localStorage.removeItem('rt');}catch(e){} showGate('접근 코드가 맞지 않습니다.'); $('saveBtn').disabled=false; return;}
  $('errorMsg').innerText = '불러오지 못했습니다: ' + (error && error.message ? error.message : '알 수 없는 오류');
  $('error').style.display = 'block';
  $('saveBtn').disabled = false;
}

function toast(msg){const t=$('toast');t.innerText=msg;t.style.display='block';clearTimeout(toast._t);toast._t=setTimeout(()=>t.style.display='none',2600);}

function handleFormSubmit(e){
  e.preventDefault();
  $('saveBtn').disabled = true; showLoading(true);
  const formData = {
    date: $('date').value, category: $('category').value,
    goalValue: $('goalValue').value, achieveValue: $('achieveValue').value,
    memo: $('memo').value, retrospect: $('retrospect').value
  };
  api('add',{record:formData}).then(res => {
    showLoading(false); $('saveBtn').disabled = false;
    toast(res && res.message ? res.message : '저장했습니다.');
    ['goalValue','achieveValue','memo','retrospect'].forEach(id => $(id).value = '');
    switchTab('summary', document.querySelectorAll('.tab-btn')[1]);
  }).catch(onDataError);
}

function renderList(){
  const filter = $('filterCategory').value;
  const box = $('recordList');
  const rows = filter === '전체' ? globalRecords : globalRecords.filter(r => r.category === filter);
  if (!rows.length){
    box.innerHTML = '<div class="empty">' + (filter === '전체' ? '아직 기록이 없습니다. 입력 탭에서 오늘 첫 기록을 남겨보세요.' : esc(filter) + ' 기록이 없습니다.') + '</div>';
    return;
  }
  box.innerHTML = rows.map(r => `
    <div class="record-item">
      <div class="record-title">${esc(r.category)}<span class="badge badge-${esc(r.restStatus)}">${esc(r.restStatus)}</span></div>
      <div class="record-fig">${esc(r.achieveValue)} <span>/ ${esc(r.goalValue)}</span></div>
      <div class="record-sub">${esc(r.date)}${r.memo ? ' · ' + esc(r.memo) : ''}</div>
      <div></div>
      ${r.retrospect ? `<div class="record-sub" style="grid-column:1/-1">${esc(r.retrospect)}</div>` : ''}
    </div>`).join('');
}

function showLoading(show){$('loading').style.display = show ? 'block' : 'none';}
</script>
</body>
</html>
